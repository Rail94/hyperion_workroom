version: "3.9"

services:
  django:
    build: ./backend
    ports:
      - "8000:8000"

  fastapi:
    build: ./api
    ports:
      - "8001:8000"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: hyperion_workroom